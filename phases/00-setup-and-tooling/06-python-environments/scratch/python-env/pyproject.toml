[project]
name = "python-env"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Klisarsana", email = "muchliswicaksana.ar@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy >= 1.26",
    "matplotlib >= 3.8",
    "jupyter >= 1.0",
    "scikit-learn >= 1.4"
]

[project.optional-dependencies]
torch = ["torch >= 2.3", "torchvision >= 0.18"]
llm = ["google-genai"]

[project.scripts]
python-env = "python_env:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
